<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1e1f24;
            color: #f3f4f6;
        }

        .auth-card {
            width: min(420px, calc(100% - 32px));
            background-color: #2b2d33;
            border: 1px solid #3a3d45;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #9ca3af;
            line-height: 1.4;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 14px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background-color: #202228;
            color: #f9fafb;
        }

        button {
            width: 100%;
            padding: 11px 14px;
            border: none;
            border-radius: 6px;
            background-color: #b91c1c;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background-color: #dc2626;
        }

        .auth-link {
            margin: 18px 0 0;
            text-align: center;
            color: #d1d5db;
        }

        a {
            color: #fca5a5;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background-color: #3a2020;
            color: #fecaca;
            display: none;
        }
    </style>
</head>
<body>
<main class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Register to keep your tasks and comments private.</p>

    <div id="errorMessage" class="message">This username is already taken.</div>

    <form action="/register" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Register</button>
    </form>

    <p class="auth-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </p>
</main>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        document.getElementById("errorMessage").style.display = "block";
    }
</script>
</body>
</html>
